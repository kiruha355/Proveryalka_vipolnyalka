[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proveryalka"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.3", "uvicorn==0.34.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["proveryalka*"]

[tool.setuptools.package-data]
proveryalka = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
