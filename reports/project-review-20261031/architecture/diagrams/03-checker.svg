<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 385" width="980" height="385"><title>Внутреннее устройство ядра проверки</title><desc>DSL проходит семантическую валидацию, компиляцию в TLA+, SANY и TLC. Парсер восстанавливает трассу, которая ещё раз проверяется по исходному DSL. Возвращается VerificationReport. Кэш использует hash модели, параметры и версию движка.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-03-checker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="checker"><rect class="box" x="20" y="50" width="200" height="85" rx="5"/><text x="34" y="75" class="title" text-anchor="start">BehavioralModel</text><text x="34" y="98" class="small" text-anchor="start">Конечные области, initial,</text><text x="34" y="117" class="small" text-anchor="start">guard/effects, свойства</text></g><g class="checker"><rect class="box" x="270" y="50" width="200" height="85" rx="5"/><text x="284" y="75" class="title" text-anchor="start">Валидация</text><text x="284" y="98" class="small" text-anchor="start">Типы, ссылки, области,</text><text x="284" y="117" class="small" text-anchor="start">готовность модели</text></g><g class="checker"><rect class="box" x="520" y="50" width="200" height="85" rx="5"/><text x="534" y="75" class="title" text-anchor="start">Компиляция</text><text x="534" y="98" class="small" text-anchor="start">Spec.tla + .cfg на свойство</text></g><g class="checker"><rect class="box" x="770" y="50" width="190" height="85" rx="5"/><text x="784" y="75" class="title" text-anchor="start">SANY → TLC</text><text x="784" y="98" class="small" text-anchor="start">Java subprocess</text><text x="784" y="117" class="small" text-anchor="start">Срок и лимит состояний</text></g><path class="line " d="M220 92H270" marker-end="url(#arr-03-checker)"/><path class="line " d="M470 92H520" marker-end="url(#arr-03-checker)"/><path class="line " d="M720 92H770" marker-end="url(#arr-03-checker)"/><g class="checker"><rect class="box" x="770" y="230" width="190" height="95" rx="5"/><text x="784" y="255" class="title" text-anchor="start">Парсер + валидация</text><text x="784" y="278" class="small" text-anchor="start">Статусы и шаги трассы</text><text x="784" y="297" class="small" text-anchor="start">Проверка шага по DSL</text></g><path class="line " d="M865 135V230" marker-end="url(#arr-03-checker)"/><g class="checker"><rect class="box" x="520" y="230" width="200" height="95" rx="5"/><text x="534" y="255" class="title" text-anchor="start">VerificationReport</text><text x="534" y="278" class="small" text-anchor="start">property_id, status,</text><text x="534" y="297" class="small" text-anchor="start">trace, changes, statistics</text></g><path class="line " d="M770 277H720" marker-end="url(#arr-03-checker)"/><g class="checker"><rect class="box" x="270" y="230" width="200" height="95" rx="5"/><text x="284" y="255" class="title" text-anchor="start">Материалы + кэш</text><text x="284" y="278" class="small" text-anchor="start">Версия движка, spec_hash,</text><text x="284" y="297" class="small" text-anchor="start">свойства и параметры</text></g><path class="line " d="M520 277H470" marker-end="url(#arr-03-checker)"/><g class="api"><rect class="box" x="20" y="230" width="200" height="95" rx="5"/><text x="34" y="255" class="title" text-anchor="start">API → интерфейс</text><text x="34" y="278" class="small" text-anchor="start">Отчёт отдельно от</text><text x="34" y="297" class="small" text-anchor="start">пояснения агента</text></g><path class="line " d="M270 277H220" marker-end="url(#arr-03-checker)"/><text x="490" y="185" class="small" text-anchor="middle">invariant · forbidden_state · reachable · deadlock_free</text><text x="490" y="365" class="small" text-anchor="middle">TIMEOUT / STATE_LIMIT_REACHED / ENGINE_ERROR не означают, что правило выполнено.</text></svg>