<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 650" width="980" height="650"><title>Компоненты приложения</title><desc>Клиент Mput13 обращается к API SOKLY6. API запускает аналитик kiruha355, ядро TLC kontar0 и генератор. История и версии сохраняются в SQLite, материалы проверки на диске. LLM, Java и Docker — отдельные исполнители.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-01-components" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><rect class="frame " x="330" y="20" width="370" height="535" rx="6"/><text x="342" y="40" class="small" text-anchor="start">Python / FastAPI · один backend</text><g class="ui"><rect class="box" x="20" y="75" width="255" height="115" rx="5"/><text x="34" y="100" class="title" text-anchor="start">Клиент React / TypeScript</text><text x="34" y="123" class="small" text-anchor="start">Чат, требования, версии</text><text x="34" y="142" class="small" text-anchor="start">Граф, трасса, файлы и тесты</text><text x="34" y="178" class="owner" text-anchor="start">Mput13 · #32–#40, #49</text></g><g class="api"><rect class="box" x="350" y="65" width="330" height="75" rx="5"/><text x="364" y="90" class="title" text-anchor="start">HTTP API + очередь runs</text><text x="364" y="113" class="small" text-anchor="start">REST-запросы, отмена, SSE</text><text x="364" y="128" class="owner" text-anchor="start">SOKLY6 · #20–#27</text></g><g class="agent"><rect class="box" x="350" y="190" width="330" height="75" rx="5"/><text x="364" y="215" class="title" text-anchor="start">Аналитик требований</text><text x="364" y="238" class="small" text-anchor="start">Уточнения → строгая модель</text><text x="364" y="253" class="owner" text-anchor="start">kiruha355 · #12–#19, #29</text></g><g class="checker"><rect class="box" x="350" y="315" width="330" height="75" rx="5"/><text x="364" y="340" class="title" text-anchor="start">TLCChecker</text><text x="364" y="363" class="small" text-anchor="start">DSL → TLA+ → отчёт и трасса</text><text x="364" y="378" class="owner" text-anchor="start">kontar0 · #2–#11, #43</text></g><g class="api"><rect class="box" x="350" y="440" width="330" height="75" rx="5"/><text x="364" y="465" class="title" text-anchor="start">CodegenService</text><text x="364" y="488" class="small" text-anchor="start">Модель → проект; отдельный test run</text><text x="364" y="503" class="owner" text-anchor="start">#41 + #48 · интеграция этого раунда</text></g><g class="agent"><rect class="box" x="750" y="190" width="210" height="75" rx="5"/><text x="764" y="215" class="title" text-anchor="start">LLM runtime</text><text x="764" y="238" class="small" text-anchor="start">GPT по подписке</text><text x="764" y="257" class="small" text-anchor="start">локальный codex app-server</text></g><g class="checker"><rect class="box" x="750" y="315" width="210" height="75" rx="5"/><text x="764" y="340" class="title" text-anchor="start">Java: SANY / TLC</text><text x="764" y="363" class="small" text-anchor="start">Синтаксис и проверка модели</text></g><g class="api"><rect class="box" x="750" y="440" width="210" height="75" rx="5"/><text x="764" y="465" class="title" text-anchor="start">DockerSandbox</text><text x="764" y="488" class="small" text-anchor="start">Изолированный pytest</text></g><g class="api"><rect class="box" x="20" y="430" width="255" height="100" rx="5"/><text x="34" y="455" class="title" text-anchor="start">SQLite</text><text x="34" y="478" class="small" text-anchor="start">История, источники, версии</text><text x="34" y="497" class="small" text-anchor="start">runs, отчёты, файлы генерации</text><text x="34" y="518" class="owner" text-anchor="start">SOKLY6 · storage</text></g><g class="checker"><rect class="box" x="350" y="575" width="330" height="65" rx="5"/><text x="364" y="600" class="title" text-anchor="start">Каталог материалов TLC</text><text x="364" y="623" class="small" text-anchor="start">Spec.tla, .cfg, trace, logs, manifest</text></g><path class="line " d="M275 112H350" marker-end="url(#arr-01-components)"/><text x="310" y="100" class="small" text-anchor="middle">REST</text><path class="line " d="M350 125H296V160H275" marker-end="url(#arr-01-components)"/><text x="307" y="182" class="small" text-anchor="middle">SSE</text><path class="line " d="M380 140V165H336V477"/><path class="line " d="M336 227H350" marker-end="url(#arr-01-components)"/><path class="line " d="M336 352H350" marker-end="url(#arr-01-components)"/><path class="line " d="M336 477H350" marker-end="url(#arr-01-components)"/><path class="line " d="M430 140V155H310V478H275" marker-end="url(#arr-01-components)"/><text x="286" y="330" class="small" text-anchor="end">сохранение</text><path class="line " d="M680 227H750" marker-end="url(#arr-01-components)"/><path class="line " d="M680 352H750" marker-end="url(#arr-01-components)"/><path class="line " d="M680 477H750" marker-end="url(#arr-01-components)"/><path class="line " d="M680 352H720V607H680" marker-end="url(#arr-01-components)"/><text x="710" y="558" class="small" text-anchor="end">артефакты</text><text x="490" y="55" class="small" text-anchor="middle">Общий язык обмена: BehavioralModel 1.0 + VerificationReport</text></svg>