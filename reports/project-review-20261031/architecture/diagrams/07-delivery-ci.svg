<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 625" width="980" height="625"><title>Запуск приложения и проверочные контуры</title><desc>Native launcher проверяет зависимости и запускает то же FastAPI приложение со статикой Vite. SQLite и материалы проверок остаются в постоянных каталогах. CI отдельно проверяет клиент, настоящий TLC и Docker; реальные LLM запросы вынесены в ручной provider lane.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-07-delivery-ci" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="api"><rect class="box" x="20" y="35" width="235" height="90" rx="5"/><text x="34" y="60" class="title" text-anchor="start">scripts/run-stack.sh</text><text x="34" y="83" class="small" text-anchor="start">Native запуск на loopback</text><text x="34" y="102" class="small" text-anchor="start">Без переноса auth в контейнер</text></g><g class="api"><rect class="box" x="315" y="35" width="260" height="90" rx="5"/><text x="329" y="60" class="title" text-anchor="start">Preflight + readiness</text><text x="329" y="83" class="small" text-anchor="start">Vite assets, SQLite, TLC</text><text x="329" y="102" class="small" text-anchor="start">Запись каталога материалов</text></g><g class="api"><rect class="box" x="635" y="35" width="325" height="90" rx="5"/><text x="649" y="60" class="title" text-anchor="start">Один Uvicorn / create_app</text><text x="649" y="83" class="small" text-anchor="start">REST + SSE + Vite static</text><text x="649" y="102" class="small" text-anchor="start">Существующий lifespan сервисов</text></g><path class="line " d="M255 80H315" marker-end="url(#arr-07-delivery-ci)"/><path class="line " d="M575 80H635" marker-end="url(#arr-07-delivery-ci)"/><g class="api"><rect class="box" x="20" y="205" width="260" height="85" rx="5"/><text x="34" y="230" class="title" text-anchor="start">Постоянные данные</text><text x="34" y="253" class="small" text-anchor="start">SQLite, TLC bundles, cache</text><text x="34" y="272" class="small" text-anchor="start">Переживают перезапуск приложения</text></g><g class="api"><rect class="box" x="340" y="205" width="620" height="85" rx="5"/><text x="354" y="230" class="title" text-anchor="start">Исполнители на том же компьютере</text><text x="354" y="253" class="small" text-anchor="start">Codex app-server  ·  Java / TLC  ·  Docker sandbox</text><text x="354" y="272" class="small" text-anchor="start">Каждый сервис штатно завершает принадлежащие ему операции</text></g><path class="line " d="M730 125V160H150V205" marker-end="url(#arr-07-delivery-ci)"/><path class="line " d="M800 125V205" marker-end="url(#arr-07-delivery-ci)"/><rect class="frame " x="8" y="335" width="970" height="225" rx="6"/><text x="20" y="355" class="small" text-anchor="start">Конфигурация GitHub CI в PR70</text><g class="ui"><rect class="box" x="20" y="375" width="280" height="85" rx="5"/><text x="34" y="400" class="title" text-anchor="start">frontend</text><text x="34" y="423" class="small" text-anchor="start">Typecheck / Vitest / build</text><text x="34" y="442" class="small" text-anchor="start">Основной клиент + extensions</text></g><g class="checker"><rect class="box" x="350" y="375" width="280" height="85" rx="5"/><text x="364" y="400" class="title" text-anchor="start">backend-tlc</text><text x="364" y="423" class="small" text-anchor="start">API + настоящий SANY / TLC</text><text x="364" y="442" class="small" text-anchor="start">Детерминированная граница LLM</text></g><g class="api"><rect class="box" x="680" y="375" width="280" height="85" rx="5"/><text x="694" y="400" class="title" text-anchor="start">sandbox</text><text x="694" y="423" class="small" text-anchor="start">Настоящий Docker / pytest</text><text x="694" y="442" class="small" text-anchor="start">Ownership и сохранение результатов</text></g><g class="api"><rect class="box" x="315" y="510" width="350" height="40" rx="5"/><text x="329" y="535" class="title" text-anchor="start">JUnit / logs / receipts / TLC bundles</text></g><path class="line " d="M160 460V485H490V510" marker-end="url(#arr-07-delivery-ci)"/><path class="line " d="M490 460V510" marker-end="url(#arr-07-delivery-ci)"/><path class="line " d="M820 460V485H490"/><text x="490" y="603" class="small" text-anchor="middle">Ручной provider lane: отдельный запуск, явный секрет/model и лимит запросов.</text></svg>