<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 525" width="980" height="525"><title>Путь описания и результата проверки</title><desc>Агент строит модель из исходных текстов и ответов, валидатор проверяет её структуру. Человек запускает проверку вручную. TLC возвращает отчёт, аналитик объясняет сохранённый отчёт. Явное исправление создаёт новую версию и новый запуск.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-02-analysis-check" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="api"><rect class="box" x="20" y="40" width="210" height="100" rx="5"/><text x="34" y="65" class="title" text-anchor="start">Исходные материалы</text><text x="34" y="88" class="small" text-anchor="start">Текст / TXT / MD / DOCX</text><text x="34" y="107" class="small" text-anchor="start">Source + точные цитаты</text><text x="34" y="128" class="owner" text-anchor="start">SOKLY6 + клиент Mput13</text></g><g class="agent"><rect class="box" x="285" y="40" width="270" height="100" rx="5"/><text x="299" y="65" class="title" text-anchor="start">LLM + валидация</text><text x="299" y="88" class="small" text-anchor="start">Требования, вопросы, guard/effects</text><text x="299" y="107" class="small" text-anchor="start">Ссылки, типы, явные исправления</text><text x="299" y="128" class="owner" text-anchor="start">kiruha355 · agent/*</text></g><g class="api"><rect class="box" x="615" y="40" width="340" height="100" rx="5"/><text x="629" y="65" class="title" text-anchor="start">Неизменяемая версия модели</text><text x="629" y="88" class="small" text-anchor="start">BehavioralModel: variables, transitions,</text><text x="629" y="107" class="small" text-anchor="start">properties, requirements, source_refs</text><text x="629" y="128" class="owner" text-anchor="start">model_id + version_id + spec_hash</text></g><path class="line " d="M230 90H285" marker-end="url(#arr-02-analysis-check)"/><path class="line " d="M555 90H615" marker-end="url(#arr-02-analysis-check)"/><path class="line " d="M350 140V180H125V140" marker-end="url(#arr-02-analysis-check)"/><text x="230" y="173" class="small" text-anchor="middle">вопрос → ответ пользователя</text><g class="ui"><rect class="box" x="615" y="230" width="340" height="85" rx="5"/><text x="629" y="255" class="title" text-anchor="start">«Проверить версию»</text><text x="629" y="278" class="small" text-anchor="start">Ручной запуск всех правил версии</text><text x="629" y="303" class="owner" text-anchor="start">Mput13 → API → kontar0</text></g><path class="line " d="M785 140V230" marker-end="url(#arr-02-analysis-check)"/><text x="800" y="184" class="small" text-anchor="start">после просмотра</text><text x="800" y="202" class="small" text-anchor="start">модели</text><g class="checker"><rect class="box" x="285" y="230" width="270" height="85" rx="5"/><text x="299" y="255" class="title" text-anchor="start">Сохранённый отчёт TLC</text><text x="299" y="278" class="small" text-anchor="start">Статус каждого правила + трасса</text><text x="299" y="303" class="owner" text-anchor="start">Сперва сохранение, затем объяснение</text></g><path class="line " d="M615 273H555" marker-end="url(#arr-02-analysis-check)"/><g class="agent"><rect class="box" x="20" y="230" width="210" height="85" rx="5"/><text x="34" y="255" class="title" text-anchor="start">Объяснение в чате</text><text x="34" y="278" class="small" text-anchor="start">Почему получился такой путь</text><text x="34" y="303" class="owner" text-anchor="start">LLM читает фактический отчёт</text></g><path class="line " d="M285 273H230" marker-end="url(#arr-02-analysis-check)"/><g class="ui"><rect class="box" x="285" y="385" width="390" height="100" rx="5"/><text x="299" y="410" class="title" text-anchor="start">Явное изменение пользователя</text><text x="299" y="433" class="small" text-anchor="start">Новая версия → новая ручная проверка</text><text x="299" y="452" class="small" text-anchor="start">Старая версия и её отчёт остаются</text><text x="299" y="473" class="owner" text-anchor="start">Решение по смыслу принимает человек</text></g><path class="line " d="M420 315V385" marker-end="url(#arr-02-analysis-check)"/><text x="430" y="353" class="small" text-anchor="start">при нарушении</text><path class="line accent" d="M675 428H970V25H785V40" marker-end="url(#arr-02-analysis-check)"/><text x="790" y="505" class="small" text-anchor="middle">без перезаписи старых результатов</text></svg>