<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1000 745" width="1000" height="745"><title>Связи версий, запусков и файлов</title><desc>Основные отношения SQLite: сессия содержит сообщения, источники и модели. Модель имеет версии. Запуск проверки привязан к версии и имеет события. Генерация привязана к версии, содержит файлы и запуски тестов.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-04-storage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="api"><rect class="box" x="20" y="30" width="210" height="90" rx="5"/><text x="34" y="55" class="title" text-anchor="start">sessions</text><text x="34" y="78" class="small" text-anchor="start">id, title, mode</text><text x="34" y="97" class="small" text-anchor="start">Один рабочий диалог</text></g><g class="api"><rect class="box" x="300" y="30" width="210" height="90" rx="5"/><text x="314" y="55" class="title" text-anchor="start">models</text><text x="314" y="78" class="small" text-anchor="start">id, session_id</text><text x="314" y="97" class="small" text-anchor="start">Объект анализа</text></g><g class="api"><rect class="box" x="610" y="30" width="350" height="100" rx="5"/><text x="624" y="55" class="title" text-anchor="start">model_versions</text><text x="624" y="78" class="small" text-anchor="start">id, number, parent_id, spec</text><text x="624" y="97" class="small" text-anchor="start">spec_hash, approved</text><text x="624" y="118" class="owner" text-anchor="start">Изменение = новая строка</text></g><path class="line " d="M230 75H300" marker-end="url(#arr-04-storage)"/><text x="265" y="63" class="small" text-anchor="middle">1 → N</text><path class="line " d="M510 75H610" marker-end="url(#arr-04-storage)"/><text x="560" y="63" class="small" text-anchor="middle">1 → N</text><g class="api"><rect class="box" x="20" y="235" width="210" height="90" rx="5"/><text x="34" y="260" class="title" text-anchor="start">agent_messages</text><text x="34" y="283" class="small" text-anchor="start">sequence, message_data</text><text x="34" y="302" class="small" text-anchor="start">Реплики и состояния диалога</text></g><path class="line " d="M125 120V235" marker-end="url(#arr-04-storage)"/><text x="135" y="185" class="small" text-anchor="start">1 → N</text><g class="api"><rect class="box" x="290" y="235" width="220" height="90" rx="5"/><text x="304" y="260" class="title" text-anchor="start">sources</text><text x="304" y="283" class="small" text-anchor="start">kind=text, text</text><text x="304" y="302" class="small" text-anchor="start">Исходник и ответы</text></g><path class="line " d="M180 120V165H400V235" marker-end="url(#arr-04-storage)"/><text x="310" y="155" class="small" text-anchor="middle">1 → N</text><g class="api"><rect class="box" x="290" y="430" width="220" height="90" rx="5"/><text x="304" y="455" class="title" text-anchor="start">requirements</text><text x="304" y="478" class="small" text-anchor="start">number, text, source_id</text><text x="304" y="497" class="small" text-anchor="start">R1…Rn и источник</text></g><path class="line " d="M400 325V430" marker-end="url(#arr-04-storage)"/><text x="410" y="385" class="small" text-anchor="start">1 → N</text><g class="api"><rect class="box" x="610" y="235" width="350" height="90" rx="5"/><text x="624" y="260" class="title" text-anchor="start">runs</text><text x="624" y="283" class="small" text-anchor="start">kind: agent / check / explain</text><text x="624" y="302" class="small" text-anchor="start">version_id, result_json, parent_run_id</text></g><path class="line " d="M740 130V235" marker-end="url(#arr-04-storage)"/><text x="752" y="192" class="small" text-anchor="start">версия → проверки</text><g class="api"><rect class="box" x="20" y="430" width="210" height="90" rx="5"/><text x="34" y="455" class="title" text-anchor="start">run_events</text><text x="34" y="478" class="small" text-anchor="start">run_id, event_id, data</text><text x="34" y="497" class="small" text-anchor="start">Сохранённые события SSE</text></g><path class="line " d="M740 325V370H125V430" marker-end="url(#arr-04-storage)"/><text x="630" y="359" class="small" text-anchor="middle">1 run → N событий</text><g class="api"><rect class="box" x="610" y="430" width="350" height="90" rx="5"/><text x="624" y="455" class="title" text-anchor="start">codegen_generations</text><text x="624" y="478" class="small" text-anchor="start">generation_id, version_id</text><text x="624" y="497" class="small" text-anchor="start">spec_hash, code_hash, record_json</text></g><path class="line " d="M960 108H986V475H960" marker-end="url(#arr-04-storage)"/><text x="976" y="412" class="small" text-anchor="end">1 → N</text><g class="api"><rect class="box" x="450" y="605" width="240" height="75" rx="5"/><text x="464" y="630" class="title" text-anchor="start">codegen_files</text><text x="464" y="653" class="small" text-anchor="start">path, sha256, content bytes</text></g><g class="api"><rect class="box" x="720" y="605" width="260" height="75" rx="5"/><text x="734" y="630" class="title" text-anchor="start">codegen_test_runs</text><text x="734" y="653" class="small" text-anchor="start">status, log, result_json</text></g><path class="line " d="M785 520V560H570V605" marker-end="url(#arr-04-storage)"/><text x="640" y="551" class="small" text-anchor="middle">1 → N файлов</text><path class="line " d="M785 560H850V605" marker-end="url(#arr-04-storage)"/><text x="872" y="585" class="small" text-anchor="start">1 → N тестов</text><text x="500" y="725" class="small" text-anchor="middle">Состав модели и source_refs хранятся в spec JSON; не все служебные FK показаны.</text></svg>