<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 485" width="980" height="485"><title>Генерация проекта и запуск тестов</title><desc>Подтверждённая неизменяемая версия поступает в детерминированный генератор. Файлы и manifest сохраняются. Пользователь отдельно запускает тесты в Docker. Код и тесты связаны с хэшами версии и генерации; результат pytest отделён от результата TLC.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-05-codegen-sandbox" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="ui"><rect class="box" x="20" y="35" width="225" height="100" rx="5"/><text x="34" y="60" class="title" text-anchor="start">Подтверждённая версия</text><text x="34" y="83" class="small" text-anchor="start">version_id + spec_hash</text><text x="34" y="102" class="small" text-anchor="start">Снимок результатов TLC</text><text x="34" y="123" class="owner" text-anchor="start">Подтверждение ≠ успех TLC</text></g><g class="api"><rect class="box" x="300" y="35" width="285" height="100" rx="5"/><text x="314" y="60" class="title" text-anchor="start">Детерминированный генератор</text><text x="314" y="83" class="small" text-anchor="start">DSL → шаблоны Python</text><text x="314" y="102" class="small" text-anchor="start">FastAPI + pytest, без LLM</text><text x="314" y="123" class="owner" text-anchor="start">#41 · реализовано в PR64</text></g><g class="api"><rect class="box" x="640" y="35" width="320" height="100" rx="5"/><text x="654" y="60" class="title" text-anchor="start">Сохранённая генерация</text><text x="654" y="83" class="small" text-anchor="start">generation_id + code_hash</text><text x="654" y="102" class="small" text-anchor="start">Файлы, manifest, SHA-256, ZIP</text><text x="654" y="123" class="owner" text-anchor="start">SQLite: bytes и происхождение</text></g><path class="line " d="M245 85H300" marker-end="url(#arr-05-codegen-sandbox)"/><path class="line " d="M585 85H640" marker-end="url(#arr-05-codegen-sandbox)"/><g class="ui"><rect class="box" x="640" y="210" width="320" height="80" rx="5"/><text x="654" y="235" class="title" text-anchor="start">Просмотр файлов и ZIP</text><text x="654" y="258" class="small" text-anchor="start">Дерево, строки, связанные правила</text><text x="654" y="278" class="owner" text-anchor="start">Mput13 · #49</text></g><path class="line " d="M800 135V210" marker-end="url(#arr-05-codegen-sandbox)"/><rect class="frame " x="300" y="200" width="285" height="225" rx="6"/><text x="312" y="220" class="small" text-anchor="start">Docker · граница выполнения</text><g class="api"><rect class="box" x="320" y="240" width="245" height="95" rx="5"/><text x="334" y="265" class="title" text-anchor="start">pytest сгенерированного кода</text><text x="334" y="288" class="small" text-anchor="start">Сеть выключена; проект read-only</text><text x="334" y="307" class="small" text-anchor="start">Лимиты CPU / RAM / pids / времени</text></g><path class="line " d="M640 250H585" marker-end="url(#arr-05-codegen-sandbox)"/><text x="625" y="235" class="small" text-anchor="end">запустить тесты</text><g class="api"><rect class="box" x="20" y="240" width="225" height="95" rx="5"/><text x="34" y="265" class="title" text-anchor="start">Отчёт тестового запуска</text><text x="34" y="288" class="small" text-anchor="start">passed / failed / timeout / …</text><text x="34" y="307" class="small" text-anchor="start">Лог + связь с generation_id</text></g><path class="line " d="M320 285H245" marker-end="url(#arr-05-codegen-sandbox)"/><text x="442" y="367" class="small" text-anchor="middle">Каждый executor владеет своими контейнерами</text><text x="442" y="388" class="small" text-anchor="middle">Cancel / cleanup не трогают чужой run</text><text x="490" y="463" class="small" text-anchor="middle">pytest может подтвердить соответствие ошибочной модели — статус TLC при этом остаётся violated.</text></svg>