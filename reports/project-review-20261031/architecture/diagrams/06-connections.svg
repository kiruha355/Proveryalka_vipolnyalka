<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1000 705" width="1000" height="705"><title>Источники, MCP и поставка приложения</title><desc>Текстовые документы входят в основное приложение. Репозитории, изображения и MCP подключены к основному create_app. Репозиторий превращается в ограниченный текстовый Source. Vision даёт typed extraction, но ещё не BehavioralModel. Delivery использует то же FastAPI приложение.</desc><style>
text{font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;fill:var(--foreground,#282b30)}
.small{font-size:12px;fill:var(--muted-foreground,#666a72)}.tiny{font-size:11px;fill:var(--muted-foreground,#666a72)}
.title{font-size:15px;font-weight:650}.owner{font-size:12px;fill:var(--muted-foreground,#666a72)}
.box{fill:var(--card,#fafafa);stroke:var(--border,#d2d5db);stroke-width:1.5}
.ui .box{stroke:var(--chart-1,#5077be)}.api .box{stroke:var(--chart-2,#4c9480)}
.agent .box{stroke:var(--chart-3,#b27b35)}.checker .box{stroke:var(--chart-4,#8d69a7)}
.band{fill:var(--secondary,#f1f2f4);stroke:var(--border,#d2d5db);stroke-width:1}
.frame{fill:none;stroke:var(--border,#d2d5db);stroke-width:1.3}
.pending{stroke-dasharray:6 5}.line{fill:none;stroke:var(--muted-foreground,#666a72);stroke-width:1.6}
.accent{stroke:var(--primary,#5077be);stroke-width:2}.bad{stroke:var(--destructive,#b9483e);stroke-width:1.8}
.badtext{fill:var(--destructive,#b9483e)}.goodtext{fill:var(--success,#428662)}
</style><defs><marker id="arr-06-connections" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--muted-foreground,#666a72)"/></marker></defs><g class="api"><rect class="box" x="20" y="40" width="215" height="85" rx="5"/><text x="34" y="65" class="title" text-anchor="start">Текст / TXT / MD / DOCX</text><text x="34" y="88" class="small" text-anchor="start">Извлечение и точные цитаты</text></g><g class="api"><rect class="box" x="295" y="40" width="245" height="85" rx="5"/><text x="309" y="65" class="title" text-anchor="start">Source(kind=text)</text><text x="309" y="88" class="small" text-anchor="start">Исходник с происхождением</text></g><g class="agent"><rect class="box" x="750" y="40" width="225" height="220" rx="5"/><text x="764" y="65" class="title" text-anchor="start">Основной аналитик</text><text x="764" y="88" class="small" text-anchor="start">Существующий send_message</text><text x="764" y="107" class="small" text-anchor="start">run_analyst → BehavioralModel</text><text x="764" y="145" class="small" text-anchor="start">Новый Source начинает диалог</text><text x="764" y="164" class="small" text-anchor="start">в новой сессии</text></g><path class="line " d="M235 82H295" marker-end="url(#arr-06-connections)"/><path class="line " d="M540 82H750" marker-end="url(#arr-06-connections)"/><rect class="frame " x="8" y="157" width="575" height="122" rx="6"/><text x="20" y="177" class="small" text-anchor="start">#46 · router включён в основной create_app</text><g class="api"><rect class="box" x="20" y="190" width="215" height="70" rx="5"/><text x="34" y="215" class="title" text-anchor="start">HTTPS-репозиторий</text><text x="34" y="238" class="small" text-anchor="start">Commit SHA, snapshot</text></g><g class="api"><rect class="box" x="295" y="190" width="270" height="70" rx="5"/><text x="309" y="215" class="title" text-anchor="start">Индекс → выбранные строки</text><text x="309" y="238" class="small" text-anchor="start">manifest/file hashes + Source</text></g><path class="line " d="M235 225H295" marker-end="url(#arr-06-connections)"/><path class="line " d="M565 225H750" marker-end="url(#arr-06-connections)"/><text x="660" y="210" class="small" text-anchor="middle">Source</text><rect class="frame " x="8" y="310" width="970" height="130" rx="6"/><text x="20" y="330" class="small" text-anchor="start">#45 · router и recovery подключены</text><g class="api"><rect class="box" x="20" y="345" width="215" height="75" rx="5"/><text x="34" y="370" class="title" text-anchor="start">Изображение / crop</text><text x="34" y="393" class="small" text-anchor="start">Очищенные PNG pixels</text></g><g class="agent"><rect class="box" x="295" y="345" width="245" height="75" rx="5"/><text x="309" y="370" class="title" text-anchor="start">Vision через Codex</text><text x="309" y="393" class="small" text-anchor="start">Native image input</text></g><g class="api"><rect class="box" x="600" y="345" width="360" height="75" rx="5"/><text x="614" y="370" class="title" text-anchor="start">Typed image analysis</text><text x="614" y="393" class="small" text-anchor="start">requirements + image refs + uncertainties</text></g><path class="line " d="M235 382H295" marker-end="url(#arr-06-connections)"/><path class="line " d="M540 382H600" marker-end="url(#arr-06-connections)"/><text x="780" y="465" class="small" text-anchor="middle">Автоматический переход image → BehavioralModel пока отсутствует.</text><rect class="frame " x="8" y="495" width="970" height="105" rx="6"/><text x="20" y="515" class="small" text-anchor="start">#47 · точный маршрут /mcp; общий lifecycle</text><g class="ui"><rect class="box" x="20" y="525" width="215" height="60" rx="5"/><text x="34" y="550" class="title" text-anchor="start">Кодинг-агент</text><text x="34" y="573" class="small" text-anchor="start">Совместимый MCP-клиент</text></g><g class="api"><rect class="box" x="295" y="525" width="245" height="60" rx="5"/><text x="309" y="550" class="title" text-anchor="start">MCP /mcp</text><text x="309" y="573" class="small" text-anchor="start">Модель, проверки, тесты и код</text></g><g class="api"><rect class="box" x="630" y="525" width="330" height="60" rx="5"/><text x="644" y="550" class="title" text-anchor="start">Те же backend / codegen services</text><text x="644" y="573" class="small" text-anchor="start">Без второго движка или SQLite worker</text></g><path class="line " d="M235 553H295" marker-end="url(#arr-06-connections)"/><path class="line " d="M540 553H630" marker-end="url(#arr-06-connections)"/><g class="api"><rect class="box" x="20" y="640" width="940" height="60" rx="5"/><text x="34" y="665" class="title" text-anchor="start">#31 / #44 / #48 · delivery + CI</text><text x="34" y="688" class="small" text-anchor="start">Native launcher → тот же create_app + Vite static; CI: frontend / backend-TLC / sandbox; provider lane отдельно</text></g></svg>